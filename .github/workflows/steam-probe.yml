name: Steam review probe

# Manual check: does Steam's public review endpoint answer with JSON from a GitHub-hosted runner?
# Plain requests only (no cookies, no spoofed headers).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe appreviews
        run: |
          for app in 620 413150 1145360; do
            url="https://store.steampowered.com/appreviews/${app}?json=1&language=english&num_per_page=5&filter=recent"
            echo "== ${app}"
            curl -s -o body.txt -D headers.txt "$url" || true
            grep -iE '^HTTP|^location|^content-type' headers.txt | tr -d '\r'
            if jq -e . body.txt > /dev/null 2>&1; then
              jq -c '{success, review_count: (.reviews | length), first: (.reviews[0].review // "" | .[0:80])}' body.txt
            else
              echo "not JSON: $(head -c 120 body.txt | tr '\n' ' ')"
            fi
          done
      - name: Control (appdetails)
        run: |
          curl -s -o /dev/null -w "appdetails: %{http_code} %{content_type}\n" \
            "https://store.steampowered.com/api/appdetails?appids=620"
