spring:
  application:
    name: game-market
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gamemarket}
    username: ${DB_USER:gamemarket}
    password: ${DB_PASSWORD:gamemarket}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
