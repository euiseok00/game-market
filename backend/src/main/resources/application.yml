spring:
  application:
    name: game-market
  datasource:
    url: ${GAMEMARKET_DB_URL:jdbc:postgresql://localhost:5433/gamemarket}
    username: ${GAMEMARKET_DB_USER:gamemarket}
    password: ${GAMEMARKET_DB_PASSWORD:gamemarket}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    retry:
      max-attempts: 1 # retries are owned by GeminiSummarizer (429 only, 3 retries)
    google:
      genai:
        api-key: ${GEMINI_API_KEY:not-set} # non-empty so the app still boots without a key; summaries then return 503
        chat:
          model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
          response-mime-type: application/json
          temperature: 0.2

summary:
  mode: ${SUMMARY_MODE:lazy}
  llm-timeout-ms: 20000   # one Gemini call; 429/5xx retries wait 1s, 2s, 4s on top
  wait-timeout-ms: 60000  # concurrent requests waiting on the same game's generation

server:
  servlet:
    session:
      cookie:
        same-site: lax
